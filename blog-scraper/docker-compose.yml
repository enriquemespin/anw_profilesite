version: '3.8'

services:
  blog-scraper:
    build: .
    container_name: cybersecurity-scraper
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - TZ=UTC
    # Run scan every 4 hours
    command: >
      bash -c "
        php /app/run.php scan &&
        sleep 14400 &&
        php /app/run.php scan &&
        sleep 14400 &&
        php /app/run.php scan &&
        sleep 14400 &&
        php /app/run.php scan
      "

  # Optional: Auto-post pending posts daily at 9 AM
  blog-poster:
    build: .
    container_name: blog-poster
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - TZ=UTC
    # Run daily at 9 AM
    command: >
      bash -c "
        crontab -l 2>/dev/null | grep -v 'run.php post' | crontab -;
        echo '0 9 * * * php /app/run.php post 5 >> /var/log/blog-poster.log 2>&1' | crontab -;
        cron -f
      "
    depends_on:
      - blog-scraper